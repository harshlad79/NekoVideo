name: Generate debug signing keystore

on:
  push:
    branches:
      - signing-key-setup

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore nekovideo-debug.keystore \
            -storepass android \
            -alias nekovideo-debug \
            -keypass android \
            -dname "CN=NekoVideo Debug,O=harshlad79,C=KR" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000

      - name: Upload keystore
        uses: actions/upload-artifact@v7
        with:
          name: nekovideo-debug-keystore
          path: nekovideo-debug.keystore
          if-no-files-found: error
          retention-days: 1
